[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoyoflot"
version = "0.12.0"
description = "Provenance-preserving airline readers, normalization, geography and entity resolution"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1,<2",
    # DuckDB Python UDF registration requires NumPy independently of ML.
    "numpy>=2.2,<3",
    "ijson>=3.3,<4",
    "lxml>=5.3,<7",
    "openpyxl>=3.1.5,<4",
    "pyarrow>=18,<27",
    "pymupdf>=1.26,<2",
    "pyyaml>=6.0.2,<7",
    "tzdata==2026.5",
    "flask>=3.1,<4",
    "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
yoyoflot = "yoyoflot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"yoyoflot.product" = ["static/*"]
