[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yoyoflot"
version = "0.3.5"
description = "Provenance-preserving airline dataset readers"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=18,<27", "duckdb>=1.1,<2", "ijson>=3.3,<4",
  "lxml>=5.3,<7", "PyYAML>=6.0.2,<7", "openpyxl>=3.1.5,<4",
  "PyMuPDF>=1.26,<2", "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
yoyoflot = "yoyoflot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoyoflot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
