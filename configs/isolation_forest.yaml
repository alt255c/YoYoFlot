version: if-demo-1.0
data_mode: synthetic_demo
enabled: true
as_of: '2026-03-31'
features:
  - trip_rate_30_days
  - quick_return_share
  - repeated_route_share
include_graph: false
graph_features:
  - excess_repeated_companions
  - max_positive_pair_excess_days
missing_policy: exclude_incomplete
preprocessing: none_float32
reference:
  training_seed: 101
  training_profiles: 300
  calibration_seed: 202
  calibration_profiles: 200
  min_training_rows: 32
  min_calibration_rows: 24
  min_distinct_rows: 4
forest:
  n_estimators: 200
  max_samples: 128
  random_state: 1901
  n_jobs: 1
  contamination: auto
combination:
  rules_weight: 0.5
  if_weight: 0.5
